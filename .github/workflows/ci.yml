name: Python quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m ruff check codex_orchestrators tests tools
      - run: python -m ruff format --check codex_orchestrators tests tools
      - run: python -m pytest -q
      - run: python tools/check_public_tree.py
      - run: python -m build --no-isolation
      - run: python tools/check_dist.py
      - name: Install and exercise wheel outside checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-check"
          if [ "$RUNNER_OS" = "Windows" ]; then
            wheel_python="$RUNNER_TEMP/wheel-check/Scripts/python.exe"
          else
            wheel_python="$RUNNER_TEMP/wheel-check/bin/python"
          fi
          "$wheel_python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$wheel_python" -m codex_orchestrators demo
          "$wheel_python" -m codex_orchestrators policy --role review
          "$wheel_python" -m codex_orchestrators.congress_engine --help
          "$wheel_python" -m codex_orchestrators.government_engine --help

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip_audit --require-hashes -r requirements-dev.txt --progress-spinner off

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify pinned scanner and scan candidate tree
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
