[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-multi-agent-orchestrators"
version = "0.1.0a1"
description = "Durable, policy-scoped research and phased engineering workflows for Codex CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Codex-Orchestrators-Noncommercial-1.0"
license-files = ["LICENSE"]
authors = [{name = "Mhrnqaruni"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development",
]

[project.urls]
Repository = "https://github.com/Mhrnqaruni/codex-multi-agent-orchestrators"

[project.scripts]
codex-orchestrators = "codex_orchestrators.cli:main"
codex-congress = "codex_orchestrators.congress_engine:main"
codex-government = "codex_orchestrators.government_engine:main"

[tool.setuptools]
packages = ["codex_orchestrators"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
line-ending = "lf"
